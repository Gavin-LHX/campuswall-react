server {
    listen 80;
    server_name wall.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }

    access_log /var/log/nginx/campuswall-http-access.log;
    error_log /var/log/nginx/campuswall-http-error.log;
}

server {
    listen 443 ssl http2;
    server_name wall.example.com;

    # Replace these example paths with your TLS certificate and private key.
    ssl_certificate /etc/letsencrypt/live/wall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wall.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusWallSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional when the hostname is proxied by Cloudflare. Install the bundled
    # file at this path and uncomment the next line only after reviewing it.
    # include /etc/campus-wall/cloudflare-realip.conf;

    root /opt/campus-wall/frontend/dist;
    index index.html;
    client_max_body_size 2m;
    client_body_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /api/direct_upload {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/chunked_upload {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/user/me/avatar {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/admin/apps {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /api/admin/apps/ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /api/admin/users/import {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location ^~ /static/uploads/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/tiny_files/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/apps/ {
        proxy_pass http://127.0.0.1:5412;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5412/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/campuswall-access.log;
    error_log /var/log/nginx/campuswall-error.log;
}

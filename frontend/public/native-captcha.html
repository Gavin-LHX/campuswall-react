<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>校园墙 · 安全验证</title>
<style>[hidden]{display:none!important}body{font-family:system-ui,sans-serif;background:#f4f7f3;color:#19382c;margin:0;padding:48px 24px}main{max-width:360px;margin:auto}a{display:block;padding:16px;background:#285c49;color:white;border-radius:24px;text-align:center;text-decoration:none;margin-top:24px}p{line-height:1.6}</style></head>
<body><main><h1>安全验证</h1><p>完成验证后，返回校园墙继续登录。此页面不会读取你的账号和密码。</p><div id="challenge"></div><p id="status" role="status">正在加载…</p><a id="return" hidden>返回校园墙</a></main>
<script>
const params = new URLSearchParams(location.search);
const action = params.get('action');
const state = params.get('state');
const status = document.getElementById('status');
const link = document.getElementById('return');
const complete = token => {
  link.href = 'campuswall://captcha?' + new URLSearchParams({state, token});
  link.hidden = false;
  status.textContent = '验证成功，请点击返回。';
};
const expired = () => {link.hidden = true; link.removeAttribute('href'); status.textContent = '验证已过期，请重新验证。';};
(async () => {
  try {
    if (!['login','register','admin_login'].includes(action) || !/^[a-f\d-]{36}$/i.test(state || '')) throw Error('请从校园墙 App 发起验证。');
    const response = await fetch('https://api-wall.zongtech.xyz/api/user/captcha/config');
    if (!response.ok) throw Error('验证服务暂时不可用');
    const {captcha} = await response.json();
    if (!captcha?.enabled) throw Error('当前无需验证，请返回 App 重试。');
    const script = document.createElement('script');
    script.src = captcha.provider === 'turnstile' ? 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit' : 'https://www.google.com/recaptcha/api.js?render=explicit';
    script.onload = () => {
      const options = {sitekey: captcha.site_key, callback: complete, 'expired-callback': expired, 'error-callback': expired};
      if(captcha.provider === 'turnstile') window.turnstile.render('#challenge', {...options, action});
      else window.grecaptcha.ready(() => window.grecaptcha.render('challenge', options));
      status.textContent = '请完成上方验证。';
    };
    script.onerror = () => {status.textContent='验证服务加载失败，请检查网络后刷新。';};
    document.head.appendChild(script);
  } catch(error) { status.textContent = error.message; }
})();
</script></body></html>
